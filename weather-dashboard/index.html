<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container py-5">

        <!-- Header -->
        <section class="hero text-center mb-4">

            <div class="weather-logo">
                <i class="bi bi-cloud-sun-fill"></i>
            </div>

            <h1>Weather Dashboard</h1>

            <p>
                Search for a city and get real-time weather information.
            </p>

        </section>


        <!-- Search -->
        <section class="search-card">

            <form id="searchForm">

                <div class="search-wrapper">

                    <i class="bi bi-search"></i>

                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Enter city name..."
                        autocomplete="off"
                        required
                    >

                    <button type="submit" id="searchButton">
                        Search
                    </button>

                </div>

            </form>

        </section>


        <!-- Loading -->
        <div id="loading" class="loading-state">

            <div class="spinner-border" role="status"></div>

            <p>Loading weather data...</p>

        </div>


        <!-- Error -->
        <div id="errorMessage" class="error-message">

            <i class="bi bi-exclamation-circle-fill"></i>

            <span id="errorText">
                Something went wrong.
            </span>

        </div>


        <!-- Weather -->
        <section id="weatherContent" class="weather-content">

            <!-- Location -->
            <div class="location-header">

                <div>
                    <span class="location-label">
                        Current Weather
                    </span>

                    <h2 id="cityName">--</h2>

                    <p id="locationDetails">--</p>
                </div>

                <i class="bi bi-geo-alt-fill location-icon"></i>

            </div>


            <!-- Main Weather -->
            <div class="main-weather">

                <div class="weather-icon-container">
                    <i id="weatherIcon" class="bi bi-cloud-sun-fill"></i>
                </div>

                <div class="temperature">

                    <span id="temperature">--</span>

                    <sup>°C</sup>

                    <p id="weatherDescription">
                        --
                    </p>

                </div>

            </div>


            <!-- Weather Details -->
            <div class="row g-3 mt-3">

                <div class="col-md-3 col-6">

                    <div class="weather-stat">

                        <i class="bi bi-thermometer-half"></i>

                        <span>Feels Like</span>

                        <strong id="feelsLike">--</strong>

                    </div>

                </div>


                <div class="col-md-3 col-6">

                    <div class="weather-stat">

                        <i class="bi bi-droplet-fill"></i>

                        <span>Humidity</span>

                        <strong id="humidity">--</strong>

                    </div>

                </div>


                <div class="col-md-3 col-6">

                    <div class="weather-stat">

                        <i class="bi bi-wind"></i>

                        <span>Wind Speed</span>

                        <strong id="windSpeed">--</strong>

                    </div>

                </div>


                <div class="col-md-3 col-6">

                    <div class="weather-stat">

                        <i class="bi bi-clouds-fill"></i>

                        <span>Cloud Cover</span>

                        <strong id="cloudCover">--</strong>

                    </div>

                </div>

            </div>


            <!-- API Information -->
            <div class="api-info mt-4">

                <i class="bi bi-check-circle-fill"></i>

                <span>
                    Weather data powered by Open-Meteo API
                </span>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>
                JavaScript API Integration Project
            </p>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
